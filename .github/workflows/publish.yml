name: "🚀 Publish Plugin"
permissions:
  contents: write
on:
  release:
    types:
      - released
  workflow_dispatch:
jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master

  upload:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # A "release" event fires on the tag ref, not the default branch - without this the
          # checkout lands in a detached HEAD state and the final `git push` fails.
          ref: main

      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          name: build-artifact

      - name: Prepare Release Asset Checksums
        run: |-
          for file in ./*.zip; do
            md5sum "$file" > "${file%.*}.md5"
            sha256sum "$file" > "${file%.*}.sha256"
          done
          ls -l

      - name: Upload GitHub Release Assets
        uses: shogo82148/actions-upload-release-asset@v1.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*.zip

      - name: Upload Checksum Assets
        uses: shogo82148/actions-upload-release-asset@v1.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*.md5

      - name: Upload SHA256 Checksum Assets
        uses: shogo82148/actions-upload-release-asset@v1.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*.sha256

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update manifest.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          pip install pyyaml
          python .github/scripts/update_manifest.py

      - name: Commit and Push manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for ${{ github.event.release.tag_name }}"
          git push
